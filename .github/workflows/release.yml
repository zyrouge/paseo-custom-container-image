name: Release

on:
    schedule:
        - cron: "0 0 * * *" 
    workflow_dispatch:
        inputs:
            version:
                description: "Paseo version"
                required: false
                type: string
            force_release:
                description: "Force release"
                required: false
                type: boolean
                default: true

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ""
    LOCAL_IMAGE_NAME: ""
    PASEO_VERSION: ${{ github.event.inputs.version }}
    FORCE_RELEASE: ${{ github.event.inputs.force_release }}

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - run: |
                find . -type f -name "*.sh" -exec chmod +x {} \;

            - name: Fetch release information
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ROOT_DIR="$(pwd)"
                  . "./_utils.sh"
                  echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
                  echo "LOCAL_IMAGE_NAME=$LOCAL_IMAGE_NAME" >> $GITHUB_ENV
                  "./release-info.sh"
                  echo "PASEO_VERSION=$(cat ./dist/version.txt)" >> $GITHUB_ENV
                  echo "NEEDS_RELEASE=$(cat ./dist/needs_release.txt)" >> $GITHUB_ENV

            - name: Build image
              if: ${{ env.NEEDS_RELEASE == 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: ./build.sh

            - name: Login to GHCR
              uses: redhat-actions/podman-login@v1
              if: ${{ env.NEEDS_RELEASE == 'true' }}
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Publish image to GHCR
              if: ${{ env.NEEDS_RELEASE == 'true' }}
              run: |
                  podman manifest push --all ${{ env.LOCAL_IMAGE_NAME }}:${{ env.PASEO_VERSION }} ${{ env.IMAGE_NAME }}:${{ env.PASEO_VERSION }}
                  podman manifest push --all ${{ env.LOCAL_IMAGE_NAME }}:${{ env.PASEO_VERSION }} ${{ env.IMAGE_NAME }}:latest
